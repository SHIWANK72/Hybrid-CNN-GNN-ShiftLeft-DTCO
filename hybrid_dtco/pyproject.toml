[build-system]
requires = ["poetry-core>=1.0.0", "scikit-build-core", "pybind11"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hybrid_dtco"
version = "0.1.0"
description = "Hybrid CNN-GNN Shift-Left DTCO Framework"
authors = ["Industrial AI-EDA Team <ai-eda@example.com>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
torch_geometric = ">=2.3.0"
hydra-core = "^1.3.0"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
lmdb = "^1.4.1"
numpy = "^1.24.0"
onnxruntime = "^1.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.4.1"
sphinx = "^7.0.0"
pre-commit = "^3.3.3"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
